name: CI

on:
  push:
  pull_request:

jobs:
  frontend:
    name: Frontend build + i18n check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Check required i18n keys
        run: node scripts/check-i18n.mjs

      - name: Build frontend
        run: npm run build
        env:
          ASSETS_VERSION: ${{ github.sha }}

  backend:
    name: Backend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudreve
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: cloudreve/go.mod
          cache-dependency-path: cloudreve/go.sum

      - name: Build
        run: CGO_ENABLED=0 go build ./...
